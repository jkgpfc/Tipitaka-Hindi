name: Cloud translate Wikipitaka (Free)

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Pages to translate in this run"
        required: false
        default: "5"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: tipitaka-cloud-translation
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opus-mt-en-hi-v1

      - name: Install CPU translation engine
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      - name: Translate next batch with free open-source model
        env:
          TRANSLATION_MODEL: Helsinki-NLP/opus-mt-en-hi
          TOKENIZERS_PARALLELISM: "false"
        run: |
          BATCH="${{ github.event.inputs.batch_size }}"
          if [ -z "$BATCH" ]; then BATCH="5"; fi
          python scripts/translate_site.py --batch-size "$BATCH"

      - name: Verify translations actually succeeded
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path('data/progress.json')
          if not p.exists():
              print('::error::No progress.json was produced.')
              sys.exit(1)
          d = json.loads(p.read_text(encoding='utf-8'))
          print('Translation progress:', d)
          if d.get('last_batch_selected', 0) > 0 and d.get('last_batch_succeeded', 0) == 0:
              print('::error::No pages translated successfully in this batch.')
              sys.exit(1)
          PY

      - name: Commit permanent translated pages
        run: |
          git config user.name "tipitaka-translation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data pages
          if git diff --cached --quiet; then
            echo "No new translation changes."
          else
            git commit -m "Translate next Wikipitaka batch (free model)"
            git push
          fi
